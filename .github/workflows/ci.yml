name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'chore/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Set up dependencies
        run: ./scripts/setup
      - name: Full harness verification
        run: ./scripts/verify
