name: Create or update PR

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve push actor secret
        id: actor-token
        uses: actions/github-script@v8
        with:
          script: |
            const secretName = `GH_PAT_${context.actor.replaceAll('-', '_').toUpperCase()}`;
            core.setOutput('secret-name', secretName);

      - name: Validate actor PAT
        id: validate-token
        env:
          ACTOR_PAT: ${{ secrets[steps.actor-token.outputs.secret-name] }}
          SECRET_NAME: ${{ steps.actor-token.outputs.secret-name }}
        run: |
          if [ -z "$ACTOR_PAT" ]; then
            echo "::error::Register $SECRET_NAME in Settings → Secrets and variables → Actions using the push actor's own PAT."
            exit 1
          fi

      - name: Create pull request as push actor
        id: create-pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets[steps.actor-token.outputs.secret-name] }}
          script: |
            const { data: user } = await github.rest.users.getAuthenticated();
            if (user.login.toLowerCase() !== context.actor.toLowerCase()) {
              core.setFailed('The selected PAT must belong to the original push actor. No PR was created or updated.');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const head = `${context.repo.owner}:${branch}`;
            const { data: openPulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base: 'main',
              state: 'open'
            });

            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: branch
            });
            const commitLines = comparison.commits.map(({ sha, commit, html_url }) => {
              const title = commit.message.split('\n')[0];
              return `- [\`${sha.slice(0, 7)}\`](${html_url}) ${title}`;
            });
            const commitSection = `<!-- auto-generated-commits -->\n## 커밋 내역\n\n${commitLines.join('\n') || '- 변경 커밋 없음'}\n\n<!-- end-auto-generated-commits -->`;
            const defaultBody = `## 변경 요약\n\n자동 생성된 PR입니다. 변경 목적과 영향 범위를 보완해 주세요.\n\n${commitSection}\n\n## 검증\n\n- [ ] \`./scripts/verify\`\n- [ ] 사람 리뷰 확인`;

            const pull = openPulls[0] ?? (await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'main',
              title: context.payload.head_commit?.message?.split('\n')[0] ?? `Merge ${context.ref_name}`,
              body: defaultBody
            })).data;

            if (openPulls[0]) {
              const currentBody = pull.body ?? '';
              const updatedBody = currentBody.includes('<!-- auto-generated-commits -->')
                ? currentBody.replace(/<!-- auto-generated-commits -->[\s\S]*?<!-- end-auto-generated-commits -->/, commitSection)
                : `${currentBody.trim()}\n\n${commitSection}`;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                body: updatedBody.trim()
              });
            }

            core.setOutput('pull-number', pull.number);
